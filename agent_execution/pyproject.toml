[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-utils"
version = "0.1.0"
description = "Pre-baked helpers for the Blossom Code Execution Agent sandbox"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "pandas>=2.2.0",
  "numpy>=1.26.0",
  "scipy>=1.11.0",
  "sympy>=1.12",
  "shapely>=2.0.0",
  "PuLP>=2.8.0",
  "matplotlib>=3.8.0",
  "seaborn>=0.13.0",
  "plotly>=5.18.0",
  "graphviz>=0.20.0",
  "networkx>=3.2.0",
  "Pillow>=10.0.0",
  "opencv-python-headless>=4.9.0",
  "moviepy>=1.0.3",
  "requests>=2.32.0",
  "beautifulsoup4>=4.12.0",
  "playwright>=1.40.0",
  "faiss-cpu>=1.7.4",
  "thefuzz>=0.22.0",
  "GitPython>=3.1.0",
  "openpyxl>=3.1.0",
  "pypdf>=4.0.0",
  "pdfplumber>=0.11.0",
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0", "httpx>=0.27.0"]

[tool.setuptools.packages.find]
where = ["."]
include = ["agent_utils*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
