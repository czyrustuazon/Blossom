services:
  agent-sandbox:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: blossom-agent-sandbox
    ports:
      - "8082:8082"
    environment:
      AGENT_EXEC_TIMEOUT: "30"
      AGENT_WORKSPACE: /app/workspace
      AGENT_REPO_ROOT: /app/repo
    volumes:
      - ./workspace:/app/workspace
      - ../:/app/repo:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8082/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
